<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МАНИФЕСТ — генератор случайных мыслей</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FF2E2E'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='68' font-weight='700' fill='%23FAFAFA' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       1. СБРОС + ЦВЕТОВЫЕ ПЕРЕМЕННЫЕ (правило 3 цветов)
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #FAFAFA;
      --fg:     #0A0A0A;
      --accent: #FF2E2E;
      --muted:  #666;
      --faint:  #eee;
      --line:   2px solid var(--fg);
    }

    [data-theme="dark"] {
      --bg:     #0A0A0A;
      --fg:     #FAFAFA;
      --accent: #FF2E2E;
      --muted:  #aaa;
      --faint:  #222;
      --line:   2px solid var(--fg);
    }

    html { background: var(--bg); }

    body {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* ============================================================
       2. ВЕРХНЯЯ ПАНЕЛЬ
       ============================================================ */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: var(--line);
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .brand .dot { color: var(--accent); }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-switch {
      display: flex;
      border: 1px solid var(--fg);
      overflow: hidden;
    }
    .lang-switch button {
      background: transparent;
      color: var(--fg);
      border: none;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .lang-switch button.active {
      background: var(--fg);
      color: var(--bg);
    }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--fg);
      color: var(--fg);
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s, color 0.2s;
    }
    .theme-btn:hover { background: var(--fg); color: var(--bg); }

    /* ============================================================
       3. СЦЕНА
       ============================================================ */
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
    }

    .quote-card {
      position: relative;
      max-width: 880px;
      width: 100%;
      border: var(--line);
      padding: 48px 56px;
      background: var(--bg);
      transition: transform 0.25s ease, opacity 0.25s ease, background 0.25s ease;
    }

    .quote-card::before {
      content: '';
      position: absolute;
      top: -10px; left: -10px;
      width: 36px; height: 36px;
      background: var(--accent);
      z-index: -1;
    }
    .quote-card::after {
      content: '';
      position: absolute;
      bottom: -10px; right: -10px;
      width: 36px; height: 36px;
      background: var(--fg);
      z-index: -1;
    }

    .label {
      display: inline-block;
      background: var(--fg);
      color: var(--bg);
      padding: 5px 12px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .quote {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(26px, 4.2vw, 52px);
      line-height: 1.06;
      letter-spacing: -0.02em;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .quote::before { content: '« '; color: var(--accent); }
    .quote::after  { content: ' »'; color: var(--accent); }

    .author {
      display: inline-block;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--accent);
      border-top: var(--line);
      padding-top: 14px;
      min-width: 240px;
    }
    .author::before { content: '— '; }

    /* ============================================================
       4. ПЛАШКА ПЕРЕВОДА
       ============================================================ */
    .translation {
      margin-top: 28px;
      padding: 14px 18px;
      background: var(--faint);
      border-left: 3px solid var(--accent);
    }
    .translation[hidden] { display: none; }

    .translation-label {
      display: inline-block;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .translation-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
      font-style: italic;
      transition: opacity 0.2s ease;
    }

    /* Состояние загрузки перевода */
    .translation-text.loading {
      animation: pulse 1.3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.85; }
    }

    /* ============================================================
       5. ФУТЕР
       ============================================================ */
    .footer { display: flex; flex-direction: column; }

    .btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 26px 32px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, letter-spacing 0.3s;
    }
    .btn:hover { background: var(--fg); color: var(--bg); letter-spacing: 4px; }
    .btn:disabled { opacity: 0.6; cursor: wait; }

    .btn .arrow { font-size: 22px; transition: transform 0.25s; }
    .btn:hover .arrow { transform: translateX(8px); }

    .credit {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 32px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      border-top: 1px solid var(--faint);
    }

    @media (max-width: 600px) {
      .topbar { padding: 12px 16px; gap: 8px; }
      .brand { font-size: 18px; }
      .stage  { padding: 28px 16px; }
      .quote-card { padding: 32px 24px; }
      .btn    { padding: 22px 20px; font-size: 14px; letter-spacing: 2px; }
      .credit { padding: 10px 20px; font-size: 9px; }
      .lang-switch button { padding: 6px 9px; font-size: 10px; }
      .translation { padding: 12px 14px; }
      .translation-text { font-size: 14px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">МАНИФЕСТ<span class="dot">.</span></div>
    <div class="controls">
      <div class="lang-switch" id="langSwitch">
        <button data-lang="ru" class="active">RU</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Переключить тему">🌙</button>
    </div>
  </header>

  <main class="stage">
    <article class="quote-card" id="card">
      <div class="label">Случайная мысль</div>
      <blockquote class="quote" id="quote">Загрузка...</blockquote>
      <div class="author" id="author">...</div>

      <!-- ПЛАШКА ПЕРЕВОДА -->
      <div class="translation" id="translation" hidden>
        <span class="translation-label">Перевод · MyMemory</span>
        <p class="translation-text" id="translationText"></p>
      </div>
    </article>
  </main>

  <footer class="footer">
    <button class="btn" id="btn" type="button">
      <span>Новая цитата</span>
      <span class="arrow">→</span>
    </button>
    <div class="credit">
      <span id="sourceLabel">Локальная коллекция</span>
      <span>Сделано вручную · 2026</span>
    </div>
  </footer>

  <script>
    // ============================================================
    // 1. ЭЛЕМЕНТЫ
    // ============================================================
    const quoteEl         = document.getElementById('quote');
    const authorEl        = document.getElementById('author');
    const card            = document.getElementById('card');
    const btn             = document.getElementById('btn');
    const themeBtn        = document.getElementById('themeBtn');
    const langSwitch      = document.getElementById('langSwitch');
    const sourceLabel     = document.getElementById('sourceLabel');
    const translation     = document.getElementById('translation');
    const translationText = document.getElementById('translationText');

    // ============================================================
    // 2. ТЁМНАЯ ТЕМА
    // ============================================================
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', theme);
    }
    applyTheme(localStorage.getItem('theme') || 'light');

    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ============================================================
    // 3. РУССКИЕ ЦИТАТЫ (локальная коллекция)
    // ============================================================
    const ruQuotes = [
      { quote: "Краткость — сестра таланта.", author: "Антон Чехов" },
      { quote: "Красота спасёт мир.", author: "Фёдор Достоевский" },
      { quote: "Все счастливые семьи похожи друг на друга, каждая несчастливая семья несчастлива по-своему.", author: "Лев Толстой" },
      { quote: "Я помню чудное мгновенье: передо мной явилась ты.", author: "Александр Пушкин" },
      { quote: "Умом Россию не понять, аршином общим не измерить.", author: "Фёдор Тютчев" },
      { quote: "Человек — это звучит гордо.", author: "Максим Горький" },
      { quote: "Счастье не в том, чтобы делать всегда, что хочешь, а в том, чтобы всегда хотеть того, что делаешь.", author: "Лев Толстой" },
      { quote: "Нет ничего сильнее слова.", author: "Антон Чехов" },
      { quote: "Гений и злодейство — две вещи несовместные.", author: "Александр Пушкин" },
      { quote: "Кто не любит природы, тот не любит человека.", author: "Фёдор Достоевский" }
    ];

    // Английский запас — с готовыми переводами (если API лягут)
    const enFallback = [
      {
        quote: "The only way to do great work is to love what you do.",
        author: "Steve Jobs",
        ru: "Единственный способ делать великую работу — любить то, что ты делаешь."
      },
      {
        quote: "Simplicity is the ultimate sophistication.",
        author: "Leonardo da Vinci",
        ru: "Простота — высшая степень изощрённости."
      },
      {
        quote: "It always seems impossible until it's done.",
        author: "Nelson Mandela",
        ru: "Всё кажется невозможным, пока это не будет сделано."
      },
      {
        quote: "The journey of a thousand miles begins with a single step.",
        author: "Lao Tzu",
        ru: "Путь в тысячу миль начинается с одного шага."
      },
      {
        quote: "Life is what happens when you're busy making other plans.",
        author: "John Lennon",
        ru: "Жизнь — это то, что случается с тобой, пока ты строишь планы."
      }
    ];

    // ============================================================
    // 4. СОСТОЯНИЕ
    // ============================================================
    let currentLang = 'ru';

    // ============================================================
    // 5. API-ЗАПРОСЫ
    // ============================================================
    async function fetchEnglishQuote() {
      try {
        const res = await fetch('https://dummyjson.com/quotes/random');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        return { quote: data.quote, author: data.author };
      } catch (err) {
        console.warn('EN API недоступен → fallback:', err);
        return enFallback[Math.floor(Math.random() * enFallback.length)];
      }
    }

    async function translateToRussian(text) {
      try {
        const url = 'https://api.mymemory.translated.net/get'
                  + '?q=' + encodeURIComponent(text)
                  + '&langpair=en|ru';
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (data.responseStatus !== 200) {
          throw new Error('Translation failed: ' + data.responseStatus);
        }

        const translated = data.responseData.translatedText;

        // Защита: если сервис вернул тот же текст — значит перевода нет
        if (!translated || translated.trim().toLowerCase() === text.trim().toLowerCase()) {
          return null;
        }
        return translated;
      } catch (err) {
        console.warn('Перевод недоступен:', err);
        return null;
      }
    }

    function getRussianQuote() {
      return ruQuotes[Math.floor(Math.random() * ruQuotes.length)];
    }

    // ============================================================
    // 6. ПОКАЗ ПЕРЕВОДА (с защитой от гонок)
    // ============================================================
    async function showTranslation(text, predefinedTranslation) {
      translation.hidden = false;
      translationText.classList.add('loading');
      translationText.textContent = predefinedTranslation || 'Перевод загружается…';

      let result = predefinedTranslation;

      if (!result) {
        result = await translateToRussian(text);

        // Проверка на гонку: пока грузился перевод, юзер мог сменить цитату/язык
        if (quoteEl.textContent !== text) return;
      }

      translationText.classList.remove('loading');
      translationText.textContent = result
        ? result
        : 'Перевод временно недоступен. Нажмите «Новая цитата».';
    }

    // ============================================================
    // 7. ПОКАЗ НОВОЙ ЦИТАТЫ
    // ============================================================
    async function showNewQuote() {
      btn.disabled = true;
      card.style.opacity = '0.5';
      card.style.transform = 'translateY(6px)';

      let data;
      let predefinedTranslation = null;

      if (currentLang === 'ru') {
        data = getRussianQuote();
        sourceLabel.textContent = 'Русская классика · локальная коллекция';
        translation.hidden = true;
      } else {
        data = await fetchEnglishQuote();
        sourceLabel.textContent = 'API: dummyjson.com · перевод MyMemory';
        // Если цитата пришла из fallback — у неё уже есть перевод
        predefinedTranslation = data.ru || null;
      }

      setTimeout(() => {
        quoteEl.textContent  = data.quote;
        authorEl.textContent = data.author;

        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
        btn.disabled = false;

        // Переводим ПОСЛЕ показа цитаты — не блокируем UI
        if (currentLang === 'en') {
          showTranslation(data.quote, predefinedTranslation);
        }
      }, 200);
    }

    // ============================================================
    // 8. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
    // ============================================================
    langSwitch.addEventListener('click', (e) => {
      const target = e.target.closest('button');
      if (!target) return;

      const lang = target.dataset.lang;
      if (lang === currentLang) return;

      currentLang = lang;

      langSwitch.querySelectorAll('button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });

      btn.querySelector('span:first-child').textContent =
        lang === 'ru' ? 'Новая цитата' : 'New quote';

      showNewQuote();
    });

    // ============================================================
    // 9. СТАРТ
    // ============================================================
    btn.addEventListener('click', showNewQuote);
    showNewQuote();
  </script>
</body>
</html>
